<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Consultar CA · CAEPI API</title><style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #dfe5ef;padding:18px max(18px,calc((100vw - 1180px)/2));display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}h1{font-size:1.3rem;margin:0}header p{margin:5px 0 0;color:#64748b}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav a,button{border:1px solid #cbd5e1;border-radius:9px;padding:9px 11px;text-decoration:none;background:white;color:#334155;font:inherit;font-size:.87rem;font-weight:650;cursor:pointer}.nav .active{background:#eff6ff;border-color:#bfdbfe;color:#1546a0}main{max-width:1180px;margin:24px auto;padding:0 18px 45px}.panel{background:white;border:1px solid #dfe5ef;border-radius:14px;padding:20px;margin-bottom:16px}.search{display:flex;gap:10px;flex-wrap:wrap}.search input{flex:1;min-width:210px;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}.primary{background:#155eef;color:white;border-color:#155eef}.muted{color:#64748b;line-height:1.5;font-size:.9rem}.error{background:#fef2f2;color:#991b1b;padding:12px;border-radius:9px;white-space:pre-wrap;display:none}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field{border:1px solid #e3e8f0;border-radius:10px;padding:12px;min-width:0}.field span{display:block;color:#64748b;font-size:.8rem;margin-bottom:5px}.field strong{overflow-wrap:anywhere;font-size:.94rem}.details{white-space:pre-wrap;overflow-wrap:anywhere;background:#f8fafc;border-radius:9px;padding:14px;max-height:440px;overflow:auto;font-size:.82rem}.badge{display:inline-block;border-radius:999px;background:#e0f2fe;color:#075985;padding:4px 9px;font-weight:700;font-size:.78rem}@media(max-width:750px){.fields{grid-template-columns:1fr 1fr}.nav{width:100%}}@media(max-width:470px){.fields{grid-template-columns:1fr}}
</style><script defer src="/assets/admin-session.js"></script></head><body>
<header><div><h1>Consulta administrativa</h1><p>Consulta os dados já gravados; não inicia scraping.</p></div><nav class="nav"><a href="/admin">Início</a><a href="/dashboard">Tarefas</a><a href="/certificates">Catálogo</a><a class="active" href="/admin/consult">Consultar CA</a><a href="/admin/api-keys">Chaves de API</a><a href="/admin/sources">Bases oficiais</a><button type="button" data-admin-logout>Sair</button></nav></header>
<main><section class="panel"><h2>Consultar Certificado de Aprovação</h2><p class="muted">Digite o número do CA. A consulta usa a base local e não faz requisição ao portal do MTE.</p><form id="query" class="search"><input id="ca" name="ca_lookup_number" type="search" inputmode="numeric" autocomplete="off" maxlength="32" placeholder="Ex.: 15272" required><button class="primary" type="submit">Consultar</button></form><div id="message" class="error" role="alert"></div></section>
<section class="panel" id="result" hidden><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><h2 id="title">Resultado</h2><span id="source" class="badge"></span></div><div id="fields" class="fields"></div><h3>Dados complementares</h3><pre id="details" class="details"></pre></section></main>
<script>
const $=id=>document.getElementById(id);const escapeHtml=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('query').addEventListener('submit',async event=>{event.preventDefault();$('message').style.display='none';$('result').hidden=true;const ca=$('ca').value.replace(/\D/g,'');if(!ca){$('message').textContent='Informe um número de CA válido.';$('message').style.display='block';return}try{const r=await fetch(`/api/v1/admin/certificates/${encodeURIComponent(ca)}`,{headers:{'Accept':'application/json'},cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.detail||'Falha ao consultar o CA.');const c=d.certificate;$('title').textContent=`CA ${c.ca_number}`;$('source').textContent=`Última fonte: ${c.last_source||'não informada'}`;const fields=[['Situação',c.status],['Validade',c.valid_until],['Fabricante',c.manufacturer],['CNPJ',c.manufacturer_document],['Equipamento',c.equipment_name],['Marca',c.brand],['Última atualização',c.last_source_update],['PDF disponível',c.documents?.certificate_pdf_available?'Sim':'Não'],['Tamanho PDF',c.documents?.certificate_pdf_size_bytes?`${c.documents.certificate_pdf_size_bytes} bytes`:'—']];$('fields').innerHTML=fields.map(([label,value])=>`<div class="field"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value||'—')}</strong></div>`).join('');$('details').textContent=JSON.stringify({data:c.data,sources:c.sources,documents:c.documents,created_at:c.created_at,updated_at:c.updated_at},null,2);$('result').hidden=false}catch(err){$('message').textContent=err.message;$('message').style.display='block'}});
</script></body></html>
