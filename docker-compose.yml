services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: .
    env_file: .env
    environment:
      TZ: America/Recife
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-caepi}:${POSTGRES_PASSWORD:-change-this-local-password}@db:5432/${POSTGRES_DB:-caepi}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      S3_ENDPOINT_URL: http://seaweedfs:8333
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
    expose: ["8000"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health/live"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    shm_size: "1gb"
    environment:
      TZ: America/Recife
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-caepi}:${POSTGRES_PASSWORD:-change-this-local-password}@db:5432/${POSTGRES_DB:-caepi}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      S3_ENDPOINT_URL: http://seaweedfs:8333
      CHROMIUM_BIN: /usr/bin/chromium
      CHROMEDRIVER_BIN: /usr/bin/chromedriver
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=INFO
    volumes:
      - ./app:/app/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    restart: unless-stopped

  campaign-dispatcher:
    build: .
    env_file: .env
    environment:
      TZ: America/Recife
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-caepi}:${POSTGRES_PASSWORD:-change-this-local-password}@db:5432/${POSTGRES_DB:-caepi}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      S3_ENDPOINT_URL: http://seaweedfs:8333
    command: python -m app.workers.campaign_dispatcher
    volumes:
      - ./app:/app/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build: .
    env_file: .env
    environment:
      TZ: America/Recife
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-caepi}:${POSTGRES_PASSWORD:-change-this-local-password}@db:5432/${POSTGRES_DB:-caepi}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      S3_ENDPOINT_URL: http://seaweedfs:8333
    command: celery -A app.workers.celery_app:celery_app beat --loglevel=INFO
    volumes:
      - ./app:/app/app
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-caepi}
      POSTGRES_USER: ${POSTGRES_USER:-caepi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-caepi-local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-change-this-local-secret}
      S3_BUCKET: ${S3_BUCKET:-caepi-documents}
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweedfs_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  seaweedfs_data: